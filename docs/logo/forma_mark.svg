<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Forma</title>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b866"/>
      <stop offset="1" stop-color="#e09e47"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5464"/>
      <stop offset="1" stop-color="#394150"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c333f"/>
      <stop offset="1" stop-color="#20262f"/>
    </linearGradient>
  </defs>

  <!-- an isometric block -->
  <polygon points="41.4,78 128,128 128,228 41.4,178" fill="url(#left)"/>
  <polygon points="128,128 214.6,78 214.6,178 128,228" fill="url(#right)"/>
  <polygon points="128,28 214.6,78 128,128 41.4,78" fill="url(#top)"/>

  <!-- a bored hole in the top face (drawn in the face's own plane) -->
  <g transform="matrix(0.866,0.5,-0.866,0.5,128,28)">
    <circle cx="50" cy="50" r="27" fill="#20262f"/>
    <circle cx="50" cy="50" r="27" fill="none" stroke="#fbe2bd" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#20262f" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- the F, laid on the right face -->
  <g transform="matrix(0.866,-0.5,0,1,128,128)" fill="#e09e47">
    <rect x="28" y="22" width="13" height="58"/>
    <rect x="28" y="22" width="46" height="13"/>
    <rect x="28" y="45" width="34" height="12"/>
  </g>

  <!-- edges -->
  <g fill="none" stroke="#fbe2bd" stroke-width="2" stroke-linejoin="round" stroke-opacity="0.85">
    <polyline points="41.4,78 128,128 214.6,78"/>
    <line x1="128" y1="128" x2="128" y2="228"/>
  </g>
  <polygon points="128,28 214.6,78 214.6,178 128,228 41.4,178 41.4,78" fill="none" stroke="#14181e" stroke-width="3" stroke-linejoin="round"/>
</svg>
